name: Validate Maker Lab pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install site dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate tutorial data and assets
        run: python scripts/check.py
      - name: Build site
        run: python scripts/build.py
      - name: Verify generated site links
        run: python scripts/verify_site.py
      - name: Test offline robot drawing plan contract
        run: |
          python source-data/robot-lab-draw-tree/plan_validator.py --self-test
          python source-data/robot-lab-draw-tree/plan_validator.py --svg /tmp/robot-lab/preview.svg
          test -s /tmp/robot-lab/preview.svg
