name: 制作记录 / 踩坑反馈
about: 记录一次可复现的 DIY 经验
labels: [build-log]
body:
  - type: input
    id: project
    attributes:
      label: 项目与版本
      placeholder: HachimoDock / PCB_V1.2 / 固件 R179
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: 观察到什么
      description: 只写你亲自看到或测试到的现象
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 可复现步骤
      placeholder: '1. ...\n2. ...\n3. ...'
  - type: textarea
    id: fix
    attributes:
      label: 已尝试的解决办法与结果
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 已移除 API Key、序列号、个人信息及私人对话内容
          required: true
